name: Publish v0.3.0 Once

on: workflow_dispatch

permissions: {}

concurrency:
  group: private-stable-0.3.0
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.3.0
  SOURCE_SHA: 7f9ba40a70c1ff909e45d61731e8cbd4cc30813f
  APP_ARCHIVE: SCMX-build-work-v0.3.0-macos-arm64.zip

jobs:
  build:
    if: github.repository == 'aili266/SCMX-build-work' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7f9ba40a70c1ff909e45d61731e8cbd4cc30813f
          persist-credentials: false
      - name: Check source and architecture
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = arm64
      - name: Build release app
        run: zsh build.command
      - name: Run release regression tests
        shell: bash
        run: |
          set -euo pipefail
          APP=dist/SCMX-build-work.app
          EXE="$APP/Contents/MacOS/STM32Studio"
          for test in settings register register-data programming runner log localization; do
            "$EXE" "--${test}-test"
          done
          TEST_HOME="$(mktemp -d)"
          env CFFIXED_USER_HOME="$TEST_HOME" SCMX_TEST_HOME="$TEST_HOME" "$EXE" --startup-test
          codesign --verify --deep --strict "$APP"
          test "$(lipo -archs "$EXE")" = arm64
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = 0.3.0
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")" = 5
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$APP/Contents/Info.plist")" = 13.0
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/SCMX-build-work.app "release/$APP_ARCHIVE"
          unzip -tq "release/$APP_ARCHIVE"
          cp "docs/releases/$RELEASE_TAG.md" release/RELEASE_NOTES.md
          printf '\nBuilt and tested in [GitHub Actions](%s/%s/actions/runs/%s).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release/RELEASE_NOTES.md
          cd release
          shasum -a 256 "$APP_ARCHIVE" > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: private-stable-upload
          path: release/
          if-no-files-found: error
          retention-days: 7

  # Keep repository code and third-party actions out of the write-token job.
  publish:
    needs: build
    if: github.repository == 'aili266/SCMX-build-work' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Attach verified assets and publish the private release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: aili266/SCMX-build-work
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO" --jq '.private')" = true
          test "$(gh api "repos/$GH_REPO/commits/$SOURCE_SHA" --jq '.sha')" = "$SOURCE_SHA"
          gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" --name private-stable-upload --dir release
          cd release
          sha256sum -c SHA256SUMS.txt
          gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" > refs.json
          jq -e --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$SOURCE_SHA" 'map(select(.ref == $ref)) | length == 0 or (length == 1 and .[0].object.type == "commit" and .[0].object.sha == $sha)' refs.json
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
          RELEASE_ID="$(jq -er --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | if length == 1 and .[0].draft == true then .[0].id else error("Expected one existing v0.3.0 draft") end' releases.json)"
          jq -e --argjson id "$RELEASE_ID" '.[] | select(.id == $id) | .assets | length == 0' releases.json
          jq -n --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" --rawfile body RELEASE_NOTES.md '{tag_name:$tag,target_commitish:$sha,name:("SCMX-build work " + $tag),body:$body,draft:true,prerelease:false,make_latest:"false"}' > draft.json
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" --input draft.json --jq '.id'
          gh release upload "$RELEASE_TAG" "$APP_ARCHIVE" SHA256SUMS.txt --repo "$GH_REPO"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" > assets.json
          for file in "$APP_ARCHIVE" SHA256SUMS.txt; do
            digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            size="$(stat -c %s "$file")"
            jq -e --arg name "$file" --arg digest "$digest" --argjson size "$size" '[.[] | select(.name == $name and .state == "uploaded" and .size == $size and .digest == $digest)] | length == 1' assets.json
          done
          test "$(jq length assets.json)" = 2
          test "$(gh api "repos/$GH_REPO" --jq '.private')" = true
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f make_latest=true --jq '.html_url'
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.id')" = "$RELEASE_ID"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '{url:.html_url,tag:.tag_name,draft,prerelease,assets:[.assets[] | {name,size,digest,state}]}'
